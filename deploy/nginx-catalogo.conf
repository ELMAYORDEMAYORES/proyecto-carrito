# Catálogo SaaS — sitio nginx
# Copiar a /etc/nginx/sites-available/catalogo y habilitar con symlink.

server {
    listen 80;
    listen [::]:80;
    server_name catalogo.appco.com.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name catalogo.appco.com.co;

    ssl_certificate /etc/ssl/certs/cloudflare-origin.crt;
    ssl_certificate_key /etc/ssl/private/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/catalogo/dist;
    index index.html;

    # API -> servidor Express (Docker, puerto 3000)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imágenes subidas -> servidor Express
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # SPA (React Router) fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para assets estáticos con hash
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires max;
        log_not_found off;
        add_header Cache-Control "public, immutable";
    }
}
