name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build -w client

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy code (server source + config)
        run: |
          rsync -az \
            --exclude '.git' \
            --exclude 'node_modules/' \
            --exclude 'client/dist' \
            --exclude 'server/dist' \
            --exclude 'server/uploads' \
            --exclude '.env' \
            --exclude '.env.production' \
            -e "ssh -i ~/.ssh/deploy" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/catalogo/"

      - name: Deploy frontend build
        run: |
          rsync -az --delete client/dist/ \
            -e "ssh -i ~/.ssh/deploy" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/catalogo/dist/"

      - name: Rebuild & restart server container
        run: |
          ssh -i ~/.ssh/deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            cd ~/catalogo
            docker build -f server/Dockerfile -t catalogo-server .
            docker rm -f catalogo-server 2>/dev/null || true
            docker run -d --name catalogo-server --network host --restart unless-stopped \
              --env-file ~/catalogo/.env.production \
              -v ~/catalogo/uploads:/app/uploads \
              catalogo-server
          "
